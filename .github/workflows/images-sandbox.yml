name: images-sandbox

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "images/**"
      - "cmd/osg-init/**"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  pull_request:
    paths:
      - "images/**"
      - "cmd/osg-init/**"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # OpenShell-style: one image name per flavor under …/sandboxes/<name>
  IMAGE_PREFIX: ghcr.io/zorneth/osg/sandboxes

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cli
            name: base
          - target: gui
            name: gui
          - target: gpu
            name: gpu
    steps:
      - name: Checkout osg-runtime
        uses: actions/checkout@v4
        with:
          path: osg-runtime
      - name: Checkout osg-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: osg-core
          ref: main
      - name: Checkout osg-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: osg-driver
          ref: main
      - name: Checkout osg-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: osg-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Build osg-init into image context
        working-directory: osg-runtime
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o images/sandbox/osg-init ./cmd/osg-init
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: osg-runtime/images/sandbox
          file: osg-runtime/images/sandbox/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
